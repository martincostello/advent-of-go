name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

env:
  FORCE_COLOR: 3
  # renovate: datasource=github-releases depName=golangci-lint packageName=golangci/golangci-lint
  GOLANGCI_LINT_VERSION: 'v2.15.0'
  TERM: xterm

permissions: {}

jobs:

  benchmark:
    name: benchmark
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:

      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Setup Go
        uses: actions/setup-go@v7.1.0
        with:
          cache: false
          go-version-file: go.mod

      - name: Benchmark
        run: |
          go test -benchmem -run=^$ -bench "^BenchmarkCmdRun$" "github.com/martincostello/advent-of-go/cmd" -memprofile=mem.out

      - name: Upload memory profile
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          if-no-files-found: ignore
          name: memory
          path: mem.out

  lint:
    name: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:

      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Setup Go
        uses: actions/setup-go@v7.1.0
        with:
          cache: false
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: Add actionlint problem matcher
        run: echo "::add-matcher::.github/actionlint-matcher.json"

      - name: Lint workflows with actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

      - name: Lint workflows with zizmor
        uses: zizmorcore/zizmor-action@v0.9.2
        with:
          persona: pedantic

      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v25.1.0
        with:
          config: '.markdownlint.json'
          globs: |
            **/*.md

  test:
    name: test
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:

      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Setup Go
        uses: actions/setup-go@v7.1.0
        with:
          cache: false
          go-version-file: go.mod

      - name: Test
        run: |
          go test -v -race  -coverpkg=./... -coverprofile=coverage.out ./...

      - name: Upload coverage report
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          if-no-files-found: ignore
          name: coverage
          path: coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
